name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test optional country CSV validator
        run: python -B skills/fastapi-templates-xtn/scripts/test_validate_country_csv.py
      - name: Test safe Skill updater
        run: python -B scripts/test_update_installed_skill.py
      - name: Validate release package
        run: python -B scripts/validate_release.py
      - name: Require recorded pre-tag evidence for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -B scripts/validate_release.py --release-ready

  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skills/fastapi-templates-xtn/assets/postgresql-rbac
    env:
      PIP_CONSTRAINT: constraints-ci-py312.txt
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rbac_example_test
      TEST_DISPOSABLE_DATABASE: rbac_example_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_CAPTCHA_REDIS_URL: redis://127.0.0.1:6379/14
      TEST_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6380/0
      TEST_REDIS_ISOLATION_CONFIRMED: "yes"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rbac_example_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rbac_example_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      redis-rate-limit:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            skills/fastapi-templates-xtn/assets/postgresql-rbac/pyproject.toml
            skills/fastapi-templates-xtn/assets/postgresql-rbac/constraints-ci-py312.txt
      - name: Upgrade packaging tools
        run: python -B -m pip install --upgrade "pip==26.2.1" "setuptools==84.0.0"
      - name: Install asset and test dependencies
        env:
          PIP_BUILD_CONSTRAINT: constraints-ci-py312.txt
        run: python -B -m pip install -c constraints-ci-py312.txt -e ".[test]"
      - name: Test CI dependency validator
        working-directory: ${{ github.workspace }}
        run: python -B scripts/test_validate_ci_environment.py
      - name: Verify installed dependency closure
        run: |
          python -B -m pip check
          python -B ../../../../scripts/validate_ci_environment.py
      - name: Validate wheel contents
        run: python -B ../../../../scripts/validate_asset_wheel.py . ../../VERSION
      - name: Format check
        run: ruff format --check --no-cache .
      - name: Lint
        run: ruff check --no-cache .
      - name: Type check
        run: mypy app tests
      - name: Audit dependency vulnerabilities
        run: pip-audit --local --skip-editable --progress-spinner off
      - name: Verify the single migration head
        run: test "$(alembic heads)" = "0004_password_auth (head)"
      - name: Unit tests
        run: python -B -m pytest -p no:cacheprovider -m "not postgresql"
      - name: PostgreSQL integration tests
        run: python -B -m pytest -p no:cacheprovider -m postgresql
      - name: Install disposable Redis topology test binary
        run: |
          # Only use the binary; the Redis service container already owns 6379.
          sudo systemctl mask redis-server.service
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Redis standalone, Sentinel, and Cluster client integration
        run: TEST_REDIS_SERVER="$(command -v redis-server)" python -B -m pytest -p no:cacheprovider tests/test_redis_topology_live.py
