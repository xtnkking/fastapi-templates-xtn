name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release package
        run: python scripts/validate_release.py

  asset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skills/fastapi-templates-xtn/assets/postgresql-rbac
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/rbac_example_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rbac_example_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rbac_example_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: skills/fastapi-templates-xtn/assets/postgresql-rbac/pyproject.toml
      - name: Install asset and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app tests
      - name: Unit tests
        run: pytest -m "not postgresql"
      - name: PostgreSQL integration tests
        run: pytest -m postgresql
