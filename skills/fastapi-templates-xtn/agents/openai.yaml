interface:
  display_name: "FastAPI Templates XTN"
  short_description: "FastAPI RBAC, local auth, localized API messages, and audits"
  default_prompt: "Use $fastapi-templates-xtn to build a single-project PostgreSQL FastAPI service with strict RBAC, Argon2id username/password authentication, all five required graphical CAPTCHA flows, Redis-gated Access Tokens, per-business rate limits, zh-CN/en API messages selected by Accept-Language, project-selected administrator password reset (direct by default or temporary), offline sole-super-admin recovery, and durable audits; do not implement anonymous password recovery, add email/SMS verification or MFA only when explicitly requested, and add more languages only when the product requires them."
