  short_description: "Opinionated PostgreSQL/Redis FastAPI auth baseline"
  default_prompt: "Use $fastapi-templates-xtn to build or harden a single-project service that explicitly adopts its PostgreSQL, Redis, local-password, fixed-hierarchy RBAC, all five required graphical CAPTCHA flows, bilingual API-message, and audit baseline; do not implement anonymous password recovery, and consider email/SMS verification or MFA only when explicitly requested as separate project-specific designs because the bundled asset does not implement them."
