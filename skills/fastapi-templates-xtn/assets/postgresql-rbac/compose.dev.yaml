services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rbac_example
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rbac_example"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rbac-example-postgres:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

volumes:
  rbac-example-postgres:
