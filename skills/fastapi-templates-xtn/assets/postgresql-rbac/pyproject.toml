[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-postgresql-rbac-example"
version = "0.7.0"
description = "Opinionated single-project RBAC reference for FastAPI and PostgreSQL"
requires-python = ">=3.12"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "PyJWT>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "redis>=5.3.1,<6",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "autopep8>=2.3.2,<3",
  "httpx>=0.28,<1",
  "mypy>=1.14,<3",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.assets.locales" = ["*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"
markers = [
  "postgresql: requires the PostgreSQL and Redis services from compose.dev.yaml",
]

[tool.ruff]
line-length = 120
target-version = "py312"
cache-dir = "~/.cache/fastapi-templates-xtn/ruff"

# Preserve vertically aligned method parameters and indented Chinese docstrings.
# autopep8 owns layout; Ruff owns lint/import checks, not formatting.
[tool.autopep8]
max_line_length = 120
recursive = true
exclude = ".git,.venv,venv,__pycache__,build,dist"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# 项目明确保留 UTF-8 文件头；不要让自动修复删除用户要求的编码说明。
# 保留直观的 TypeVar/Generic 写法，不让 Ruff 要求改回 Python 3.12 专属泛型声明。
ignore = ["UP009", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# Depends 在函数定义时声明 FastAPI 依赖，不是在默认参数里执行业务。
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
cache_dir = "~/.cache/fastapi-templates-xtn/mypy"
